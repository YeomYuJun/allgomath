name: Deploy Backend to EC2

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # 수동 실행 가능

env:
  DOCKER_IMAGE_NAME: allgomath-api
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon
          echo "✅ Gradle build completed"

      # 4. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        run: |
          # Git commit SHA를 태그로 사용 (버전 관리)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

          # Docker 이미지 빌드
          docker build -t ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest .
          docker build -t ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA .

          # Docker Hub에 푸시
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA

          echo "✅ Docker images pushed:"
          echo "  - ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
          echo "  - ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA"

      # 6. EC2 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deployment..."

            # 작업 디렉토리로 이동
            cd /home/ec2-user/allgomath_project/allgomath/allgomath_docker

            # 최신 이미지 pull
            docker pull ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest

            # docker-compose에서 이미지 업데이트 (임시)
            sed -i 's|build:|# build:|' docker-compose-ful.yml
            sed -i 's|context: ..|# context: ..|' docker-compose-ful.yml
            sed -i 's|dockerfile: Dockerfile|# dockerfile: Dockerfile|' docker-compose-ful.yml
            sed -i '/allgomath-api:/a\    image: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest' docker-compose-ful.yml

            # 컨테이너 재시작
            docker-compose -f docker-compose-ful.yml pull allgomath-api
            docker-compose -f docker-compose-ful.yml up -d allgomath-api

            # 헬스체크
            echo "⏳ Waiting for health check..."
            sleep 30

            HEALTH_STATUS=$(curl -s http://localhost:8080/actuator/health | grep -o '"status":"UP"' || echo "DOWN")

            if [[ "$HEALTH_STATUS" == *"UP"* ]]; then
              echo "✅ Deployment successful! Application is healthy."
            else
              echo "❌ Deployment failed! Health check returned: $HEALTH_STATUS"
              exit 1
            fi

            # 로그 확인
            docker-compose -f docker-compose-ful.yml logs --tail=50 allgomath-api

      # 7. 배포 성공 알림
      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Backend deployment completed successfully!"
          echo "📦 Image: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
          echo "🌐 API: https://api.allgomath.com"
          echo "🔍 Health: https://api.allgomath.com/actuator/health"

      # 8. 배포 실패 알림
      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Backend deployment failed!"
          echo "Please check the logs above for details."
