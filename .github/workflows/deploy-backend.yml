name: Deploy Backend to EC2

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # 수동 실행 가능

env:
  DOCKER_IMAGE_NAME: allgomath-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon
          echo "Gradle build completed"

      # 4. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4.5. 이미지 태그용 사용자명 정규화 (소문자화, 공백 제거)
      - name: Normalize Docker username
        run: echo "DOCKER_USER=$(echo '${{ secrets.DOCKER_USERNAME }}' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 5. Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        run: |
          # Git commit SHA를 태그로 사용 (버전 관리)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

          docker build -t ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE_NAME }}:latest .
          docker tag ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE_NAME }}:latest ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA

          docker push ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA

          echo "Docker images pushed:"
          echo "  - ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
          echo "  - ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA"

      # 6. EC2 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Starting deployment..."

            cd /home/ec2-user/allgomath/allgomath_docker

            # 허브 이미지를 받아 compose 빌드 이미지 이름으로 태깅 (compose 파일 수정 불필요)
            docker pull ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            docker tag ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE_NAME }}:latest allgomath_docker-allgomath-api:latest

            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            $DC -f docker-compose-production.yml up -d --no-build allgomath-api

            # 헬스체크 (최대 2분 폴링)
            echo "Waiting for health check..."
            HEALTH=DOWN
            for i in $(seq 1 12); do
              sleep 10
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then HEALTH=UP; break; fi
            done

            if [ "$HEALTH" = "UP" ]; then
              echo "Deployment successful! Application is healthy."
            else
              echo "Deployment failed! Health check: $HEALTH"
              exit 1
            fi

            # nginx가 재생성된 api 컨테이너의 새 IP를 다시 잡도록 재시작
            $DC -f docker-compose-production.yml restart nginx || true

            $DC -f docker-compose-production.yml logs --tail=50 allgomath-api

      # 7. 배포 성공 알림
      - name: Deployment Summary
        if: success()
        run: |
          echo "Backend deployment completed successfully!"
          echo "Image: ${{ env.DOCKER_USER }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
          echo "API: https://api.allgomath.com"
          echo "Health: https://api.allgomath.com/actuator/health"

      # 8. 배포 실패 알림
      - name: Deployment Failed
        if: failure()
        run: |
          echo "Backend deployment failed!"
          echo "Please check the logs above for details."
