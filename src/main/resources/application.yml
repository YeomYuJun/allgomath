spring:
  application:
    name: allgomath
  # Redis 설정 추가
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # 캐시 설정 추가
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1시간

server:
  shutdown: graceful
  compression:
    enabled: true                           # 압축 활성화
    min-response-size: 1024                # 1KB 이상 응답만 압축
    mime-types: application/json           # JSON 응답만 압축
  tomcat:
    threads:
      max: 50
      min-spare: 10
    accept-count: 50
    max-connections: 200
    connection-timeout: 5s


#임시 비활성화
management:
  # actuator 전용 포트. compose 가 게시하지 않아 도커 네트워크 안에서만 도달 가능하다.
  server:
    port: 9099

  health:
    redis:
      enabled: true

  simple:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health, metrics, info, caches, prometheus
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      percentiles-histogram:
        http.server.requests: true
    enable:
      jvm: true
      system : true
      tomcat : true
      http : true
      web.server : true
  prometheus:
    metrics:
      export:
        enabled: true



#logging

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.cache: DEBUG
    com.yy.allgomath.fractal: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
